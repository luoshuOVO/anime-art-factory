# ==============================================================================
# 给 CloudCLI 网页无侵入注入「右上角画图进度悬浮标 + 完工页内提示」的 Nginx 片段
# 使用方法：
#   1. 把同目录的 art-progress-badge.js 放到 /etc/nginx/snippets/art-progress-badge.js
#      （打开 js 顶部把 GALLERY_URL 和 STUDIO_URL 改成你自己的访问域名或地址）
#   2. 把下面这几段 location 加进你反代 CloudCLI 的 Nginx server {} 块里
#   3. 执行 nginx -t && nginx -s reload，刷新 CloudCLI 页面即可生效
# ==============================================================================

# 1) 静态提供悬浮标 JS
location = /_custom/art-progress.js {
    alias /etc/nginx/snippets/art-progress-badge.js;
    default_type "application/javascript; charset=utf-8";
    add_header Cache-Control "no-cache";
}

# 2) 只读代理画图工坊轻量状态接口（带服务端缓存，不压垮后端）
location = /_custom/art-live-badge {
    limit_except GET { deny all; }
    add_header Cache-Control "no-store";
    proxy_pass http://127.0.0.1:28096/api/live-badge;
}

# 3) 保持 CloudCLI 的 API / WebSocket / 静态资源原样透传（不影响流式输出与压缩）
location ~ ^/(api|ws|shell|assets|icons)(/|$) {
    proxy_pass http://127.0.0.1:29010; # 改成你自己的 CloudCLI 监听端口
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
}

# 4) 仅对主 HTML 页面无侵入注入一行 <script>
location / {
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter '</body>' '<script data-cfasync="false" defer src="/_custom/art-progress.js"></script></body>';
    proxy_pass http://127.0.0.1:29010; # 改成你自己的 CloudCLI 监听端口
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
