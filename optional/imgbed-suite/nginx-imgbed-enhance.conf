# ==============================================================================
# 给 CloudFlare-ImgBed 无侵入注入 4 个网页增强脚本的 Nginx 片段：
#   1. imgbed-gallery-btn.js    （首页进图库 / 顶部返回键 / 点空白关大图）
#   2. imgbed-folder-cn.js      （文件夹中文显示层）
#   3. imgbed-copy-draw-btn.js  （一键「复制去生图」防重按钮）
#   4. art-progress-badge.js    （右上角实时生图进度悬浮标）
# ==============================================================================

location = /_custom/imgbed-gallery.js {
    alias /etc/nginx/snippets/imgbed-gallery-btn.js;
    default_type "application/javascript; charset=utf-8";
    add_header Cache-Control "no-cache";
}
location = /_custom/imgbed-folder-cn.js {
    alias /etc/nginx/snippets/imgbed-folder-cn.js;
    default_type "application/javascript; charset=utf-8";
    add_header Cache-Control "no-cache";
}
location = /_custom/imgbed-copy-draw.js {
    alias /etc/nginx/snippets/imgbed-copy-draw-btn.js;
    default_type "application/javascript; charset=utf-8";
    add_header Cache-Control "no-cache";
}
location = /_custom/art-progress.js {
    alias /etc/nginx/snippets/art-progress-badge.js;
    default_type "application/javascript; charset=utf-8";
    add_header Cache-Control "no-cache";
}
location = /_custom/art-live-badge {
    limit_except GET { deny all; }
    add_header Cache-Control "no-store";
    proxy_pass http://127.0.0.1:28096/api/live-badge;
}

location / {
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter '</body>' '<script defer src="/_custom/imgbed-gallery.js"></script><script defer src="/_custom/imgbed-folder-cn.js"></script><script defer src="/_custom/imgbed-copy-draw.js"></script><script defer src="/_custom/art-progress.js"></script></body>';
    proxy_pass http://127.0.0.1:29093;
    proxy_set_header Host $host;
}
